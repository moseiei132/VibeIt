displayName: VibeIt Universal Haptic Bridge
description: Universal haptic feedback bridge for Logitech MX Master 4
events:
  # UI Interactions
  - name: hover
    displayName: Hover
    description: Light feedback for hovering over UI elements
  
  - name: click
    displayName: Click
    description: Crisp click feedback for button presses
  
  - name: double_click
    displayName: Double Click
    description: Double-tap pattern for special actions
  
  - name: drag_start
    displayName: Drag Start
    description: Feedback when starting to drag an item
  
  - name: drag_end
    displayName: Drag End
    description: Feedback when dropping an item
  
  - name: scroll_tick
    displayName: Scroll Tick
    description: Subtle tick for scroll events
  
  - name: select
    displayName: Select
    description: Smooth feedback for selection
  
  # Notifications
  - name: success
    displayName: Success
    description: Happy feedback for successful operations
  
  - name: error
    displayName: Error
    description: Alert pattern for errors
  
  - name: warning
    displayName: Warning
    description: Attention-grabbing warning
  
  - name: info
    displayName: Info
    description: Gentle notification
  
  - name: completed
    displayName: Completed
    description: Task completion celebration
  
  # Gaming & Interactive
  - name: hit_light
    displayName: Light Hit
    description: Light impact feedback
  
  - name: hit_heavy
    displayName: Heavy Hit
    description: Strong impact feedback
  
  - name: damage
    displayName: Damage
    description: Taking damage feedback
  
  - name: pickup
    displayName: Pickup
    description: Collecting item feedback
  
  - name: level_up
    displayName: Level Up
    description: Achievement/level up celebration
  
  # Creative & Special
  - name: pulse
    displayName: Pulse
    description: Rhythmic pulsing pattern
  
  - name: wave
    displayName: Wave
    description: Smooth wave pattern
  
  - name: firework
    displayName: Firework
    description: Burst pattern for celebrations
  
  - name: heartbeat
    displayName: Heartbeat
    description: Rhythmic heartbeat pattern
  
  # System
  - name: stop
    displayName: Stop
    description: Emergency stop - halt all haptic feedback
